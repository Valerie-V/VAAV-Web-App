# netlify.toml
# Netlify builds the site with its Next.js runtime, which serves the pages from
# the .next build output. Do not set NETLIFY_NEXT_PLUGIN_SKIP: it switches the
# runtime off, and every page then returns Netlify's 404.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
